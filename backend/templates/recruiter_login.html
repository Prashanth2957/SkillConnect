<!DOCTYPE html>
<html>
<head>
  <title>Recruiter Login</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="auth-container">
  <h2>Recruiter Portal</h2>
  <p>Access talent profiles & projects</p>

  <form method="post">
    <input type="email" name="email" placeholder="Recruiter Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button class="btn">Login as Recruiter</button>
  </form>

  <p>New recruiter? <a href="/recruiter/signup">Create account</a></p>
</div>

</body>
</html>
