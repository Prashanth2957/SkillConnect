<!DOCTYPE html>
<html>
<head>
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="container">
  <h1>{{ title }}</h1>

  {% if users %}
    {% for u in users %}
      <div class="proj-card">
        <h3>{{ u[1] }}</h3>
        <p>{{ u[2] }}</p>
        <a href="/candidate/{{ u[0] }}" class="proj-btn">View Profile</a>
      </div>
    {% endfor %}
  {% else %}
    <p>No users found</p>
  {% endif %}

  <br>
  <a href="/" class="proj-btn">⬅ Back Home</a>
</div>

</body>
</html>
