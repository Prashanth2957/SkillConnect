<!DOCTYPE html>
<html>
<head>
  <title>Recruiter Signup</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="auth-container">
  <h2>Join as Recruiter</h2>
  <p>Hire talent directly</p>

  <form method="post">
    <input type="text" name="name" placeholder="Company / Recruiter Name" required>
    <input type="email" name="email" placeholder="Official Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button class="btn">Register</button>
  </form>

  <p>Already registered? <a href="/recruiter/login">Login</a></p>
</div>

</body>
</html>
